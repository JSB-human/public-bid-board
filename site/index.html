<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공공사업 공고 모음</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f2f4f6; --card: #ffffff; --text: #191f28; --sub: #4e5968; --muted: #8b95a1; --faint: #b0b8c1;
    --line: #f2f4f6; --field: #f2f4f6; --hover: #f9fafb;
    --blue: #3182f6; --blue-weak: #e8f3ff; --blue-text: #1b64da;
    --red: #f04452; --red-weak: #ffeeee;
    --green: #03b26c; --green-weak: #e5f8ef;
    --purple: #8b5cf6; --purple-weak: #f1ebfe;
    --orange: #fe9800; --orange-weak: #fff3e0;
    --teal: #18a5a5; --teal-weak: #e3f6f6;
    --shadow: 0 1px 2px rgba(0, 27, 55, .04), 0 2px 8px rgba(0, 27, 55, .04);
    --shadow-up: 0 4px 16px rgba(0, 27, 55, .08);
    --header-bg: rgba(242, 244, 246, .82);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101013; --card: #1b1b20; --text: #f2f4f6; --sub: #c3c8cf; --muted: #868b94; --faint: #5b6068;
      --line: #26262c; --field: #26262c; --hover: #222228;
      --blue: #4c97fd; --blue-weak: #1a2a40; --blue-text: #7cb3ff;
      --red: #ff6b76; --red-weak: #3a1d21;
      --green: #2fca8a; --green-weak: #16302a;
      --purple: #a78bfa; --purple-weak: #2a2140;
      --orange: #ffb04a; --orange-weak: #3a2a12;
      --teal: #3cc6c6; --teal-weak: #133131;
      --shadow: none; --shadow-up: 0 4px 16px rgba(0, 0, 0, .4);
      --header-bg: rgba(16, 16, 19, .82);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101013; --card: #1b1b20; --text: #f2f4f6; --sub: #c3c8cf; --muted: #868b94; --faint: #5b6068;
    --line: #26262c; --field: #26262c; --hover: #222228;
    --blue: #4c97fd; --blue-weak: #1a2a40; --blue-text: #7cb3ff;
    --red: #ff6b76; --red-weak: #3a1d21;
    --green: #2fca8a; --green-weak: #16302a;
    --purple: #a78bfa; --purple-weak: #2a2140;
    --orange: #ffb04a; --orange-weak: #3a2a12;
    --teal: #3cc6c6; --teal-weak: #133131;
    --shadow: none; --shadow-up: 0 4px 16px rgba(0, 0, 0, .4);
    --header-bg: rgba(16, 16, 19, .82);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); letter-spacing: -0.02em; -webkit-font-smoothing: antialiased;
    font: 16px/1.5 "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; }
  button { font: inherit; letter-spacing: inherit; color: inherit; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  /* 상단 바 */
  header { position: sticky; top: 0; z-index: 10; background: var(--header-bg);
    -webkit-backdrop-filter: saturate(180%) blur(16px); backdrop-filter: saturate(180%) blur(16px); }
  header .wrap { height: 56px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; }
  .brand i { width: 28px; height: 28px; border-radius: 9px; background: var(--blue); display: grid; place-items: center; }
  .brand i svg { width: 16px; height: 16px; color: #fff; }
  .updated { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .updated::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

  /* 히어로 */
  .hero { padding: 28px 4px 20px; }
  .hero h1 { margin: 0; font-size: 28px; line-height: 1.35; font-weight: 800; letter-spacing: -0.03em; }
  .hero h1 em { font-style: normal; color: var(--blue); }
  .hero p { margin: 8px 0 0; color: var(--sub); font-size: 15px; }

  /* 요약 숫자 */
  .stats { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 8px;
    display: grid; grid-template-columns: repeat(4, 1fr); }
  .stat { border: 0; background: none; text-align: left; cursor: pointer; padding: 14px 14px 14px; border-radius: 16px;
    transition: background .15s; position: relative; }
  .stat:hover { background: var(--hover); }
  .stat[disabled] { cursor: default; }
  .stat[disabled]:hover { background: none; }
  .stat[aria-pressed="true"] { background: var(--blue-weak); }
  .stat .label { font-size: 13px; color: var(--muted); font-weight: 500; }
  .stat .value { margin-top: 4px; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat .value small { font-size: 14px; font-weight: 600; color: var(--sub); margin-left: 2px; }
  .stat.red .value { color: var(--red); }
  .stat.orange .value { color: var(--orange); }

  /* 검색과 필터 (스크롤하면 위에 붙음) */
  .toolbar { position: sticky; top: 56px; z-index: 9; background: var(--bg); padding: 16px 0 12px; margin: 0 -16px; }
  .toolbar .inner { padding: 0 16px; }
  .search { position: relative; }
  .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
  .search input { width: 100%; height: 50px; border: 0; border-radius: 16px; background: var(--card); color: var(--text);
    box-shadow: var(--shadow); padding: 0 16px 0 46px; font: inherit; font-size: 16px; outline: none; transition: box-shadow .15s; }
  .search input::placeholder { color: var(--faint); }
  .search input:focus { box-shadow: 0 0 0 2px var(--blue); }
  .chips { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; align-items: center; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 0; cursor: pointer; height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600;
    background: var(--card); color: var(--sub); box-shadow: var(--shadow); transition: background .15s, color .15s; }
  .chip:hover { color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--card); }
  .sep { flex: none; width: 1px; height: 18px; background: var(--faint); opacity: .5; margin: 0 2px; }
  .toggle { flex: none; margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--sub); cursor: pointer; padding-left: 8px; }
  .toggle input { appearance: none; width: 42px; height: 24px; border-radius: 999px; background: var(--faint); position: relative; cursor: pointer; margin: 0; transition: background .15s; }
  .toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .18s; }
  .toggle input:checked { background: var(--blue); }
  .toggle input:checked::after { transform: translateX(18px); }

  .count { padding: 4px 4px 10px; color: var(--muted); font-size: 14px; font-weight: 500; display: flex; justify-content: space-between; }
  .count b { color: var(--text); font-weight: 700; }

  /* 공고 카드 */
  #list { display: grid; gap: 10px; padding-bottom: 8px; }
  .card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; transition: box-shadow .2s, transform .2s; }
  .card:hover { box-shadow: var(--shadow-up); }
  .card.open { box-shadow: var(--shadow-up); }
  .head { width: 100%; border: 0; background: none; text-align: left; cursor: pointer; padding: 18px 20px;
    display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: start; }
  .icon { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; }
  .icon svg { width: 22px; height: 22px; }
  .i-map { background: var(--blue-weak); color: var(--blue); }
  .i-data { background: var(--green-weak); color: var(--green); }
  .i-ai { background: var(--purple-weak); color: var(--purple); }
  .i-city { background: var(--orange-weak); color: var(--orange); }
  .i-etc { background: var(--teal-weak); color: var(--teal); }
  .body { min-width: 0; }
  .title { font-size: 16px; font-weight: 700; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { margin-top: 4px; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .meta .dot::before { content: "·"; margin-right: 8px; color: var(--faint); }
  .badges { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--field); color: var(--sub); }
  .badge.re { background: var(--orange-weak); color: var(--orange); }
  .badge.rg { background: var(--blue-weak); color: var(--blue-text); }
  .side { text-align: right; white-space: nowrap; display: grid; justify-items: end; gap: 6px; }
  .amount { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .side .sub { display: flex; align-items: center; gap: 4px; }
  .dday { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--field); color: var(--sub); }
  .dday.soon { background: var(--red-weak); color: var(--red); }
  .dday.today { background: var(--red); color: #fff; }
  .chev { width: 20px; height: 20px; color: var(--faint); transition: transform .2s; }
  .card.open .chev { transform: rotate(180deg); }
  .card.closed .title, .card.closed .amount { color: var(--muted); }

  /* 펼친 상세 */
  .detail { padding: 0 20px 20px; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .summary { background: var(--blue-weak); color: var(--text); border-radius: 14px; padding: 14px 16px; font-size: 15px; line-height: 1.65; margin: 0; }
  .summary b { color: var(--blue-text); }
  .section-title { font-size: 13px; font-weight: 700; color: var(--muted); margin: 20px 0 10px; }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tile { background: var(--field); border-radius: 14px; padding: 12px 14px; min-width: 0; }
  .tile .k { font-size: 12px; color: var(--muted); font-weight: 500; }
  .tile .v { font-size: 15px; font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
  .tile.wide { grid-column: 1 / -1; }
  .ratio { display: flex; height: 8px; border-radius: 999px; overflow: hidden; margin-top: 8px; background: var(--card); }
  .ratio span:first-child { background: var(--blue); }
  .ratio span:last-child { background: var(--faint); }
  .ratio-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; font-weight: 500; }

  .timeline { display: grid; gap: 0; position: relative; padding-left: 4px; }
  .step { display: grid; grid-template-columns: 16px 1fr auto; gap: 12px; align-items: center; padding: 8px 0; position: relative; font-size: 14px; }
  .step::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: var(--line); }
  .step:first-child::before { top: 50%; }
  .step:last-child::before { bottom: 50%; }
  .step i { width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 2px solid var(--faint); position: relative; z-index: 1; margin-left: 2px; }
  .step.done i { background: var(--faint); }
  .step.next i { border-color: var(--blue); background: var(--blue); box-shadow: 0 0 0 4px var(--blue-weak); }
  .step .n { color: var(--sub); font-weight: 600; }
  .step.next .n { color: var(--text); font-weight: 700; }
  .step .t { color: var(--muted); font-variant-numeric: tabular-nums; }

  .bg { margin: 0 0 10px; font-size: 14px; line-height: 1.65; color: var(--sub); }
  .scope { margin: 0; padding: 14px 16px 14px 18px; background: var(--field); border-radius: 14px; list-style: none; display: grid; gap: 6px; }
  .scope li { position: relative; padding-left: 14px; font-size: 14px; line-height: 1.55; color: var(--text); font-weight: 600; }
  .scope li::before { content: ""; position: absolute; left: 0; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: var(--blue); }
  .scope li.sub { margin-left: 14px; font-weight: 400; color: var(--sub); }
  .scope li.sub::before { width: 4px; height: 4px; background: var(--faint); }
  .cond { display: grid; grid-template-columns: 96px 1fr; gap: 8px; align-items: start; margin-bottom: 8px; }
  .cond .ck { font-size: 13px; color: var(--muted); font-weight: 500; padding-top: 6px; }
  .lic.warn { background: var(--red-weak); color: var(--red); }
  .lics { display: flex; flex-wrap: wrap; gap: 6px; }
  .lic { font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 10px; background: var(--field); color: var(--sub); }
  .note { font-size: 13px; color: var(--muted); margin-top: 6px; }

  .files { display: grid; gap: 6px; }
  .file { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); background: var(--field);
    border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 500; transition: background .15s; min-width: 0; }
  .file:hover { background: var(--line); }
  .file .ext { flex: none; font-size: 11px; font-weight: 800; padding: 3px 6px; border-radius: 6px; color: #fff; background: var(--faint); min-width: 38px; text-align: center; }
  .file .ext.pdf { background: #f04452; }
  .file .ext.hwp { background: #3182f6; }
  .file .ext.xls { background: #03b26c; }
  .file span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .cta { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 20px; height: 52px; border-radius: 14px;
    background: var(--blue); color: #fff; text-decoration: none; font-weight: 700; font-size: 16px; transition: filter .15s; }
  .cta:hover { filter: brightness(.95); }
  .cta svg { width: 18px; height: 18px; }

  .empty { background: var(--card); border-radius: 20px; padding: 56px 20px; text-align: center; color: var(--muted); box-shadow: var(--shadow); }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }
  footer { color: var(--muted); font-size: 13px; padding: 24px 4px 56px; line-height: 1.7; }

  @media (max-width: 640px) {
    .hero { padding-top: 20px; }
    .hero h1 { font-size: 24px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stat .value { font-size: 20px; }
    .head { grid-template-columns: 40px 1fr; padding: 16px; gap: 12px; }
    .icon { width: 40px; height: 40px; border-radius: 12px; }
    .side { grid-column: 2; grid-row: 2; display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .side .chev { display: none; }
    .detail { padding: 0 16px 16px; }
    .tiles { grid-template-columns: 1fr 1fr; }
    .cond { grid-template-columns: 1fr; gap: 4px; }
    .cond .ck { padding-top: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h7"/></svg></i>공고 모음</div>
    <div class="updated" id="updated">불러오는 중</div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>지금 입찰할 수 있는<br>공공사업 <em id="heroCount">-</em>건</h1>
    <p>공간정보 · 데이터 · AI 분야 나라장터 용역 공고를 모았어요.</p>
  </section>

  <section class="stats">
    <button class="stat" disabled><div class="label">진행 중</div><div class="value" id="sOpen">-</div></button>
    <button class="stat" disabled><div class="label">추정가격 합계</div><div class="value" id="sSum">-</div></button>
    <button class="stat red" data-only="soon" aria-pressed="false"><div class="label">3일 안에 마감</div><div class="value" id="sSoon">-</div></button>
    <button class="stat orange" data-only="re" aria-pressed="false"><div class="label">재공고</div><div class="value" id="sRe">-</div></button>
  </section>

  <div class="toolbar">
    <div class="inner">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="사업명이나 발주기관을 검색해 보세요" aria-label="검색">
      </div>
      <div class="chips" id="chips">
        <button class="chip" data-sort="amount">금액 높은 순</button>
        <button class="chip" data-sort="deadline">마감 빠른 순</button>
        <span class="sep"></span>
        <button class="chip" data-min="0">전체 금액</button>
        <button class="chip" data-min="100000000">1억 이상</button>
        <button class="chip" data-min="300000000">3억 이상</button>
        <label class="toggle">마감 전만 <input type="checkbox" id="open" checked></label>
      </div>
    </div>
  </div>

  <div class="count" id="count"></div>
  <div id="list"></div>

  <footer>
    금액은 추정가격(부가세 제외)이에요. 참가자격과 마감 시각은 나라장터 원문에서 꼭 확인하세요.<br>
    <span id="source"></span>
  </footer>
</main>

<script>
const state = { items: [], sort: 'amount', min: 0, only: null, open: new Set() };
const $ = (id) => document.getElementById(id);
const DAY = 86400000;

const ICONS = {
  map: '<path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/>',
  data: '<path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/>',
  ai: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
  city: '<path d="M3 21h18M5 21V8l6-4v17M11 21V10l8 3v8M8 11v.01M8 15v.01M15 15v.01M15 18v.01"/>',
  etc: '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
};
const svg = (p, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const CHEV = '<path d="m6 9 6 6 6-6"/>';
const OUT = '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>';

function kindOf(x) {
  const s = (x.keywords || []).join(' ') + ' ' + x.title;
  if (/AI|인공지능|생성형/.test(s)) return 'ai';
  if (/스마트도시|스마트시티|드론/.test(s)) return 'city';
  if (/공간정보|GIS|도시계획|3차원|디지털\s?트윈|지도/.test(s)) return 'map';
  if (/빅데이터|데이터/.test(s)) return 'data';
  return 'etc';
}

function parseDeadline(s) {
  if (!s) return null;
  const t = Date.parse(String(s).trim().replace(' ', 'T') + '+09:00');
  return Number.isNaN(t) ? null : t;
}
function won(n) {
  if (n == null) return '-';
  const eok = Math.floor(n / 1e8), man = Math.round((n % 1e8) / 1e4);
  return ((eok ? eok + '억 ' : '') + (man ? man.toLocaleString('ko-KR') + '만 ' : '')).trim() + '원';
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function kst(t) { return new Date(t + 9 * 3600000); }
function dueLabel(t) {
  const d = kst(t);
  return (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일 ' + String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
}
function shortDate(t) {
  const d = kst(t);
  return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + ' ' + String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
}
// 한국시간 날짜 기준 남은 일수
function daysLeft(t, now) {
  const a = kst(now), b = kst(t);
  return Math.round((Date.UTC(b.getUTCFullYear(), b.getUTCMonth(), b.getUTCDate()) - Date.UTC(a.getUTCFullYear(), a.getUTCMonth(), a.getUTCDate())) / DAY);
}
const isOpen = (x, now) => x._dl === null || x._dl >= now;
const isSoon = (x, now) => x._dl !== null && x._dl >= now && x._dl - now <= 3 * DAY;
const isRe = (x) => !!(x.detail && x.detail.reNotice);

function renderStats() {
  const now = Date.now();
  const open = state.items.filter((x) => isOpen(x, now));
  const sum = open.reduce((a, x) => a + (x.amount || 0), 0);
  $('heroCount').textContent = open.length;
  $('sOpen').innerHTML = open.length + '<small>건</small>';
  $('sSum').innerHTML = (sum / 1e8).toFixed(1) + '<small>억</small>';
  $('sSoon').innerHTML = open.filter((x) => isSoon(x, now)).length + '<small>건</small>';
  $('sRe').innerHTML = open.filter(isRe).length + '<small>건</small>';
}

function render() {
  const q = $('q').value.trim().toLowerCase();
  const openOnly = $('open').checked;
  const now = Date.now();

  document.querySelectorAll('[data-sort]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.sort === state.sort));
  document.querySelectorAll('[data-min]').forEach((b) => b.setAttribute('aria-pressed', Number(b.dataset.min) === state.min));
  document.querySelectorAll('[data-only]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.only === state.only));

  const rows = state.items.filter((x) => {
    if (q && !(x.title + ' ' + x.org).toLowerCase().includes(q)) return false;
    if (state.min && (x.amount ?? 0) < state.min) return false;
    if (openOnly && !isOpen(x, now)) return false;
    if (state.only === 'soon' && !isSoon(x, now)) return false;
    if (state.only === 're' && !isRe(x)) return false;
    return true;
  });
  rows.sort((a, b) => {
    const [av, bv, dir] = state.sort === 'amount' ? [a.amount, b.amount, -1] : [a._dl, b._dl, 1];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    return (av - bv) * dir;
  });

  const label = state.only === 'soon' ? '3일 안에 마감' : state.only === 're' ? '재공고' : '';
  $('count').innerHTML = `<span><b>${rows.length}</b>건${label ? ' · ' + label : ''}</span>` +
    (state.only ? '<button class="chip" id="clearOnly" style="height:28px;font-size:13px">필터 해제</button>' : '');

  if (!rows.length) {
    $('list').innerHTML = '<div class="empty"><b>조건에 맞는 공고가 없어요</b>검색어나 필터를 바꿔 보세요.</div>';
    return;
  }
  $('list').innerHTML = rows.map((x) => cardHtml(x, now)).join('');
}

function cardHtml(x, now) {
  const open = state.open.has(x.id);
  const kind = kindOf(x);
  let dday = '', closed = false;
  if (x._dl !== null) {
    const n = daysLeft(x._dl, now);
    if (x._dl < now) { closed = true; dday = '<span class="dday">마감</span>'; }
    else if (n === 0) dday = `<span class="dday today">오늘 ${x._dlWord}</span>`;
    else dday = `<span class="dday ${x._dl - now <= 3 * DAY ? 'soon' : ''}">D-${n}</span>`;
  }
  const dueText = x._dl !== null ? `${shortDate(x._dl)} ${x._dlWord}` : '';
  const badges = [];
  if (isRe(x)) badges.push('<span class="badge re">재공고</span>');
  if (x.regions && x.regions.length) badges.push(`<span class="badge rg">${esc(x.regions.join('·'))} 업체만</span>`);
  (x.keywords || []).slice(0, 2).forEach((k) => badges.push(`<span class="badge">${esc(k)}</span>`));

  return `<article class="card ${open ? 'open' : ''} ${closed ? 'closed' : ''}">
    <button class="head" data-id="${esc(x.id)}" aria-expanded="${open}">
      <span class="icon i-${kind}">${svg(ICONS[kind])}</span>
      <span class="body">
        <span class="title">${esc(x.title)}</span>
        <span class="meta"><span>${esc(x.org)}</span>${dueText ? `<span class="dot">${dueText}</span>` : ''}</span>
        ${badges.length ? `<span class="badges">${badges.join('')}</span>` : ''}
      </span>
      <span class="side">
        <span class="amount">${won(x.amount)}</span>
        <span class="sub">${dday}${svg(CHEV, 'chev')}</span>
      </span>
    </button>
    ${open ? detailHtml(x, now) : ''}
  </article>`;
}

function when(s) {
  const t = parseDeadline(s);
  return t === null ? '' : dueLabel(t);
}

// API 가 주는 항목을 조합해 만든 요약. 공고문 본문을 읽고 쓴 것은 아니다.
function summaryHtml(x) {
  const d = x.detail || {};
  const cat = (d.category || []).slice(-1)[0];
  let s = `<b>${esc(x.org)}</b>에서 발주한 ${cat ? esc(cat) + ' ' : ''}용역이에요.`;
  const award = (d.award || '').replace(/^협상에의한계약-/, '');
  const how = [x.method, award].filter(Boolean).map(esc).join(', ');
  if (how) s += ` ${how} 방식으로 업체를 정해요.`;
  if (d.reNotice) s += ' 앞선 공고가 유찰돼 <b>다시 나온 재공고</b>예요.';
  return s;
}

function detailHtml(x, now) {
  const d = x.detail;
  const cta = `<a class="cta" href="${esc(x.url)}" target="_blank" rel="noopener">나라장터에서 원문 보기 ${svg(OUT)}</a>`;
  if (!d) return `<div class="detail"><p class="summary">상세 정보는 다음 갱신 때 채워져요.</p>${cta}</div>`;

  const doc = x.doc || {};
  const tiles = [];
  const tile = (k, v, wide) => { if (v) tiles.push(`<div class="tile ${wide ? 'wide' : ''}"><div class="k">${k}</div><div class="v">${v}</div></div>`); };
  tile('사업기간', esc(doc.period), true);
  tile('추정가격', won(x.amount));
  tile('배정예산 (부가세 포함)', d.budget != null ? won(d.budget) : '');
  tile('공동수급', esc((d.joint || '').replace(/^\(전자\)/, '')));
  tile('참가 지역', x.regions ? (x.regions.length ? esc(x.regions.join(', ')) + ' 업체만' : '제한 없음') : '');
  if (d.techRate != null && d.priceRate != null) {
    tiles.push(`<div class="tile wide"><div class="k">평가 비율</div>
      <div class="ratio"><span style="width:${d.techRate}%"></span><span style="width:${d.priceRate}%"></span></div>
      <div class="ratio-legend"><span>기술 ${d.techRate}</span><span>가격 ${d.priceRate}</span></div></div>`);
  }
  tile('분류', esc((d.category || []).join(' › ')), true);

  // 일정
  const steps = [
    ['참가등록 마감', parseDeadline(d.regDeadline)],
    ['입찰 시작', parseDeadline(d.bidBegin)],
    [x._dlWord === '개찰' ? '입찰 마감' : '입찰 마감', parseDeadline(x.deadline)],
    ['개찰', parseDeadline(d.opening)],
  ].filter(([, t]) => t !== null).sort((a, b) => a[1] - b[1]);
  const nextIdx = steps.findIndex(([, t]) => t >= now);
  const timeline = steps.length ? `<div class="section-title">일정</div><div class="timeline">${steps.map(([n, t], i) =>
    `<div class="step ${i < nextIdx || nextIdx === -1 ? 'done' : ''} ${i === nextIdx ? 'next' : ''}"><i></i><span class="n">${n}</span><span class="t">${dueLabel(t)}</span></div>`).join('')}</div>` : '';

  // 참가 조건: 시스템에 등록된 면허 + 공고문에서 찾은 직접생산확인·지역 조건
  const cond = [];
  if (x.licenses && x.licenses.length) {
    cond.push(`<div class="cond"><div class="ck">면허·업종</div><div class="lics">${x.licenses.map((l) => `<span class="lic">${esc(l.name.replace(/\/\d+$/, ''))}</span>`).join('')}</div></div>`);
  }
  if (doc.direct && doc.direct.length) {
    cond.push(`<div class="cond"><div class="ck">직접생산확인</div><div class="lics">${doc.direct.map((p) => `<span class="lic">${esc(p.name)}</span>`).join('')}</div></div>`);
  }
  if (doc.regionReq && doc.regionReq.length) {
    cond.push(`<div class="cond"><div class="ck">본문 지역 조건</div><div class="lics"><span class="lic warn">${esc(doc.regionReq.join('·'))} 소재 업체</span></div></div>`);
  }
  if (doc.regionDuty) cond.push('<div class="note">지역업체와 공동수급해야 하는 조건이 있어요.</div>');
  const lics = cond.length || x.licenses
    ? `<div class="section-title">참가 조건</div>${cond.join('') || '<div class="note">등록된 제한이 없어요.</div>'}<div class="note">${doc.files ? '공고문에서 자동으로 찾은 조건이라 빠진 게 있을 수 있어요.' : '직접생산확인 같은 조건은 공고문 본문에서 확인하세요.'}</div>`
    : '';

  // 사업 내용: 제안요청서(없으면 공고문)에서 발췌
  let scopeHtml = '';
  if (doc.scope && doc.scope.length) {
    const items = doc.scope.map((raw) => {
      const l = raw.replace(/[-]/g, '').trim();
      const sub = /^[-‐–·•‧*]/.test(l);
      const text = l.replace(/^([-‐–·•‧❍○●◦〇ㅇ□■▶‣*]|[가-하]\.|\d{1,2}(?:\.\d{1,2})*[.)]|[①-⑳])\s*/, '');
      return text ? `<li class="${sub ? 'sub' : ''}">${esc(text)}</li>` : '';
    }).join('');
    const bg = (doc.background || []).map((l) => l.replace(/[-]/g, '').replace(/^([-‐–·•‧❍○●◦〇ㅇ□■▶‣*]|[가-하]\.|\d{1,2}(?:\.\d{1,2})*[.)])\s*/, '').trim()).filter(Boolean).join(' ');
    const src = (doc.files || []).find((f) => /제안|과업|규격/.test(f)) || (doc.files || [])[0] || '';
    scopeHtml = `<div class="section-title">사업 내용</div>
      ${bg ? `<p class="bg">${esc(bg.length > 220 ? bg.slice(0, 220) + '…' : bg)}</p>` : ''}
      <ul class="scope">${items}</ul>
      <div class="note">${esc(src.replace(/\.[a-z0-9]+$/i, '').replace(/^\d+\.\s*/, '').replace(/^.*› /, ''))}에서 자동으로 발췌했어요.</div>`;
  } else if (doc.files) {
    const hasRfp = (doc.files || []).some((f) => /제안|과업|규격/.test(f));
    scopeHtml = `<div class="section-title">사업 내용</div><div class="note">${hasRfp
      ? '제안요청서에서 사업 내용 부분을 찾지 못했어요. 첨부파일에서 확인하세요.'
      : '제안요청서가 첨부되지 않았고, 공고문에는 사업 내용이 따로 적혀 있지 않아요.'}</div>`;
  }

  const files = (d.files || []).map((f) => {
    const ext = (f.name.match(/\.([a-z0-9]+)$/i) || [, ''])[1].toLowerCase();
    const cls = ext === 'pdf' ? 'pdf' : /^hwp/.test(ext) ? 'hwp' : /^xls/.test(ext) ? 'xls' : '';
    return `<a class="file" href="${esc(f.url)}" target="_blank" rel="noopener"><span class="ext ${cls}">${esc(ext.toUpperCase() || 'FILE')}</span><span>${esc(f.name.replace(/\.[a-z0-9]+$/i, ''))}</span></a>`;
  }).join('');

  return `<div class="detail">
    <p class="summary">${summaryHtml(x)}</p>
    ${scopeHtml}
    <div class="section-title">핵심 정보</div>
    <div class="tiles">${tiles.join('')}</div>
    ${lics}
    ${timeline}
    ${files ? `<div class="section-title">첨부파일</div><div class="files">${files}</div>` : ''}
    ${cta}
  </div>`;
}

$('list').addEventListener('click', (e) => {
  const b = e.target.closest('button.head');
  if (!b) return;
  const id = b.dataset.id;
  if (state.open.has(id)) state.open.delete(id); else state.open.add(id);
  render();
});
$('chips').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.sort) state.sort = b.dataset.sort;
  if (b.dataset.min !== undefined) state.min = Number(b.dataset.min);
  render();
});
document.querySelector('.stats').addEventListener('click', (e) => {
  const b = e.target.closest('[data-only]');
  if (!b) return;
  state.only = state.only === b.dataset.only ? null : b.dataset.only;
  render();
});
$('count').addEventListener('click', (e) => {
  if (e.target.id === 'clearOnly') { state.only = null; render(); }
});
['q', 'open'].forEach((id) => $(id).addEventListener('input', render));

fetch('data/bids.json', { cache: 'no-store' })
  .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then((data) => {
    // 입찰 마감 시각이 비어 있는 공고는 개찰 시각을 대신 쓴다.
    state.items = (data.items || []).map((x) => {
      const dl = parseDeadline(x.deadline);
      const op = dl === null && x.detail ? parseDeadline(x.detail.opening) : null;
      return { ...x, _dl: dl ?? op, _dlWord: dl === null && op !== null ? '개찰' : '마감' };
    });
    const u = new Date(data.updatedAt);
    $('updated').textContent = Number.isNaN(u.getTime()) ? '-' :
      u.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) + ' 갱신';
    $('source').textContent = '출처: ' + (data.source || '-');
    renderStats();
    render();
  })
  .catch((err) => { $('count').textContent = '데이터를 불러오지 못했어요: ' + err.message; });
</script>
</body>
</html>
