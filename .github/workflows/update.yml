name: 공고 갱신 및 배포

on:
  schedule:
    # 한국시간 07시, 12시, 17시 17분 (UTC 22시, 03시, 08시). 정각은 GitHub 예약이 몰려 크게 밀려서 피한다.
    - cron: '17 22,3,8 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 공고 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch.mjs

      - name: PDF 글자 추출 도구 설치
        run: sudo apt-get install -y -qq poppler-utils >/dev/null

      - name: 첨부파일에서 사업 내용 발췌
        # 실패해도 목록 배포는 계속한다.
        continue-on-error: true
        run: |
          node scripts/docs.test.mjs
          node scripts/docs.mjs

      - name: 데이터 변경분 커밋
        run: |
          if [ -n "$(git status --porcelain site/data cache)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data cache
            git commit -m "공고 데이터 갱신"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
