name: 공고 갱신 및 배포

on:
  schedule:
    # GitHub 예약은 늦거나 건너뛰는 일이 잦다 (3시간마다로 걸어도 실제로는 하루 2~3번만 돌았다).
    # 그래서 30분마다 두드리고, 아래 gate 작업이 마지막 갱신 후 2시간 반이 지났을 때만 통과시킨다.
    # 결과적으로 3시간쯤마다 한 번 갱신된다. 정각은 예약이 몰려 피한다.
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 예약 실행은 마지막 데이터 갱신 후 충분히 지났을 때만 통과시킨다. 직접 실행·푸시는 늘 통과.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_GAP_MINUTES: 150
        run: |
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 확인에 실패하면 건너뛰지 않고 갱신한다.
            last=$(gh api "repos/${{ github.repository }}/commits?path=site/data/bids.json&per_page=1" --jq '.[0].commit.committer.date' || true)
            if [ -n "$last" ] && [ "$last" != "null" ]; then
              age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
              echo "마지막 갱신: $last (${age}분 전)"
              if [ "$age" -lt "$MIN_GAP_MINUTES" ]; then run=false; fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "갱신 실행: $run"

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 문서 파서(kordoc) 설치
        # OCR·이미지 같은 선택 기능과 설치 스크립트는 빼고 설치한다.
        run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund

      - name: 공고 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch.mjs

      - name: PDF 글자 추출 도구 설치
        run: sudo apt-get install -y -qq poppler-utils >/dev/null

      - name: 첨부파일에서 사업 내용 발췌
        # 실패해도 목록 배포는 계속한다.
        continue-on-error: true
        run: |
          node scripts/docs.test.mjs
          node scripts/docs.mjs

      - name: 마감 공고 결과 수집 (참여 업체·낙찰·계약)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/results.mjs

      - name: 발주기관 이력 요약 생성
        run: node scripts/org-history.mjs

      - name: 업체 정보 정리 (이력·관계·직원 수·재무)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/companies.mjs

      - name: 데이터 변경분 커밋
        run: |
          if [ -n "$(git status --porcelain site/data cache)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data cache
            git commit -m "공고 데이터 갱신"
            # 다시 실행하거나 실행이 겹쳐 원격이 앞서 있으면 그 위에 얹는다.
            git pull --rebase -X theirs origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # 올리기와 배포를 다른 작업으로 나눠, 올린 묶음이 확정된 뒤에 배포한다.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
