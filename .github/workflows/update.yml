name: 공고 갱신 및 배포

on:
  schedule:
    # 3시간마다 17분 (한국시간 00·03·06·09·12·15·18·21시). GitHub 예약은 늦거나 건너뛰는 일이 잦아
    # 횟수를 늘려 한 번 빠져도 다음 번에 메운다. 정각은 예약이 몰려 피한다.
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 공고 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch.mjs

      - name: PDF 글자 추출 도구 설치
        run: sudo apt-get install -y -qq poppler-utils >/dev/null

      - name: 첨부파일에서 사업 내용 발췌
        # 실패해도 목록 배포는 계속한다.
        continue-on-error: true
        run: |
          node scripts/docs.test.mjs
          node scripts/docs.mjs

      - name: 데이터 변경분 커밋
        run: |
          if [ -n "$(git status --porcelain site/data cache)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data cache
            git commit -m "공고 데이터 갱신"
            # 다시 실행하거나 실행이 겹쳐 원격이 앞서 있으면 그 위에 얹는다.
            git pull --rebase -X theirs origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # 올리기와 배포를 다른 작업으로 나눠, 올린 묶음이 확정된 뒤에 배포한다.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
